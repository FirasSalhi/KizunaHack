<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIZU KIZUNA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23155e3b'/><path d='M16 7c-4 6-6 9-6 12a6 6 0 0 0 12 0c0-3-2-6-6-12z' fill='%23a7e3c4'/></svg>">
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="/static/vendor/leaflet-geoman.css">
<link rel="stylesheet" href="/static/app.css?v=2.4.1">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#155e3b"/><path d="M16 7c-4 6-6 9-6 12a6 6 0 0 0 12 0c0-3-2-6-6-12z" fill="#a7e3c4"/></svg>
    <div><b>MIZU KIZUNA</b><span data-i18n="tagline"></span></div>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" data-i18n-ph="searchPh" autocomplete="off">
    <ul id="suggest" hidden></ul>
  </div>
  <button class="ghost" id="locate">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
    <span data-i18n="myPos"></span>
  </button>
  <div class="langs" role="group" aria-label="Langue / اللغة / 言語">
    <button data-lang="fr">FR</button><button data-lang="tn" lang="ar">تونسي</button><button data-lang="ja" lang="ja">日本語</button>
  </div>
</header>

<div class="layout">
  <div id="map"></div>
  <aside id="panel">
    <section id="wizard">
      <ol class="steps">
        <li class="step active" data-step="1">
          <div class="step-head"><span class="num">1</span><h2 data-i18n="s1"></h2></div>
          <div class="step-body">
            <p data-i18n="s1t"></p>
            <div class="quick">
              <span data-i18n="quick"></span>
              <button data-fly="36.535,10.66,15" data-i18n="qCapBon"></button>
              <button data-fly="35.67,10.05,15" data-i18n="qKairouan"></button>
              <button data-fly="33.90,8.12,16" data-i18n="qTozeur"></button>
              <button data-fly="36.36,140.44,15" data-i18n="qIbaraki"></button>
            </div>
          </div>
        </li>
        <li class="step" data-step="2">
          <div class="step-head"><span class="num">2</span><h2 data-i18n="s2"></h2></div>
          <div class="step-body">
            <p data-i18n="s2t"></p>
            <div class="row">
              <button class="primary" id="drawBtn" data-i18n="draw"></button>
              <button class="ghost" id="editBtn" data-i18n="edit" hidden></button>
              <button class="ghost" id="clearBtn" data-i18n="clear" hidden></button>
            </div>
            <p class="farm-info" id="farmInfo" hidden></p>
          </div>
        </li>
        <li class="step" data-step="3">
          <div class="step-head"><span class="num">3</span><h2 data-i18n="s3"></h2></div>
          <div class="step-body">
            <label class="q" data-i18n="qSource"></label>
            <div class="choices" data-name="source">
              <button data-v="puits" class="on" data-i18n="srcWell"></button>
              <button data-v="reseau" data-i18n="srcNet"></button>
              <button data-v="pluie" data-i18n="srcRain"></button>
            </div>
            <div id="irrigBlock">
              <label class="q" data-i18n="qMethod"></label>
              <div class="choices" data-name="method">
                <button data-v="goutte_a_goutte" class="on" data-i18n="mDrip"></button>
                <button data-v="aspersion" data-i18n="mSprink"></button>
                <button data-v="gravitaire" data-i18n="mGrav"></button>
              </div>
              <label class="q" for="volume"><span data-i18n="qVolume"></span> <small data-i18n="qVolumeSmall"></small></label>
              <div class="volume">
                <input id="volume" type="number" min="0" step="500" placeholder="30000" dir="ltr">
                <span data-i18n="perYear"></span>
              </div>
              <p class="hint" id="volumeHint"></p>
            </div>
            <label class="q" data-i18n="qSalt"></label>
            <div class="choices" data-name="salinity">
              <button data-v="non" class="on" data-i18n="no"></button>
              <button data-v="un_peu" data-i18n="aBit"></button>
              <button data-v="oui" data-i18n="yes"></button>
            </div>
            <details class="more">
              <summary data-i18n="advanced"></summary>
              <label class="q" data-i18n="qSoil"></label>
              <div class="choices" data-name="soil">
                <button data-v="" class="on" data-i18n="soilAuto"></button>
                <button data-v="sableux" data-i18n="soilSand"></button>
                <button data-v="limoneux" data-i18n="soilLoam"></button>
                <button data-v="argileux" data-i18n="soilClay"></button>
              </div>
              <label class="q" data-i18n="qKinds"></label>
              <div class="choices" data-name="kinds">
                <button data-v="all" class="on" data-i18n="kAll"></button>
                <button data-v="annual" data-i18n="kAnnual"></button>
                <button data-v="perennial" data-i18n="kTrees"></button>
              </div>
            </details>
            <button class="primary big" id="goBtn" disabled data-i18n="go"></button>
            <p class="hint" id="goHint" data-i18n="goHint"></p>
          </div>
        </li>
      </ol>
    </section>
    <section id="results" hidden></section>
  </aside>
</div>

<div id="loading" hidden>
  <div class="loading-card">
    <div class="spinner"></div>
    <h3 data-i18n="loadTitle"></h3>
    <ul id="loadSteps">
      <li data-i18n="load1"></li><li data-i18n="load2"></li><li data-i18n="load3"></li><li data-i18n="load4"></li><li data-i18n="load5"></li>
    </ul>
    <p class="hint" data-i18n="loadHint"></p>
  </div>
</div>
<div id="toast" hidden></div>

<script src="/static/vendor/leaflet.js"></script>
<script src="/static/vendor/leaflet-geoman.js"></script>
<script src="/static/i18n.js?v=2.4"></script>
<script src="/static/app.js?v=2.4.1"></script>
</body>
</html>
