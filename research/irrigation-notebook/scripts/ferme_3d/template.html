<title>FARMLINK Ferme 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D field; title chip top-left, mode switch top-right, farm panel docked right (bottom sheet on phones). */
:root{
  --surface:rgba(252,251,246,.95); --surface-solid:#fcfbf6; --ink:#1d2419; --muted:#5d6656; --line:#dcdfd3; --accent:#2e6a39; --accent-ink:#ffffff;
  --now:#c8322a; --soon:#d9861c; --fine:#2f8a45; --missing:#6b7f93; --water:#1d6db0; --bg:#cfe3ef;
  --f-display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --f-body:Inter,"Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:rgba(22,27,20,.94); --surface-solid:#161b14; --ink:#e6ebe0; --muted:#a0aa97; --line:#323b2c; --accent:#7cc68a; --accent-ink:#0f1a10; --now:#ff7a70; --soon:#f2b35a; --fine:#74d48f; --missing:#9fb3c6; --water:#6fb4f0; --bg:#1c2a33; color-scheme:dark}}
:root[data-theme="dark"]{--surface:rgba(22,27,20,.94); --surface-solid:#161b14; --ink:#e6ebe0; --muted:#a0aa97; --line:#323b2c; --accent:#7cc68a; --accent-ink:#0f1a10; --now:#ff7a70; --soon:#f2b35a; --fine:#74d48f; --missing:#9fb3c6; --water:#6fb4f0; --bg:#1c2a33; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);overflow:hidden}
*{box-sizing:border-box}
#app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}
.float{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(20,30,15,.14);backdrop-filter:blur(6px)}
#title{top:max(12px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:10px 14px;display:grid;gap:2px;max-width:min(360px,calc(100% - 32px))}
#title h1{font:700 18px var(--f-display);margin:0}
#title p{margin:0;font-size:12px;color:var(--muted)}
#modes{top:max(12px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:4px;display:flex;gap:4px}
button{font:600 13px var(--f-body);border-radius:9px;padding:7px 11px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer}
button.on{background:var(--accent);color:var(--accent-ink)}
button.ghost{border-color:var(--line);background:var(--surface-solid)}
button.add{border:1px dashed var(--accent);color:var(--accent);background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#panel{right:max(16px,env(safe-area-inset-right,0px));top:calc(max(12px,env(safe-area-inset-top,0px)) + 56px);bottom:max(16px,env(safe-area-inset-bottom,0px));width:350px;display:flex;flex-direction:column;overflow:hidden}
#panel .scroll{overflow-y:auto;padding:14px;display:grid;gap:16px;align-content:start}
#panel h2{font:600 15px var(--f-display);margin:0}
.lab{font:600 11px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.plots{display:grid;gap:6px}
.plot{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-solid);font-weight:500}
.plot.sel{border-color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.detail{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.verdict{border-radius:12px;padding:12px;color:#fff;display:grid;gap:4px}
.verdict b{font:700 18px var(--f-display)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{border:1px solid var(--line);border-radius:9px;padding:7px 9px;display:grid}
.kv span{font-size:11px;color:var(--muted)} .kv b{font:600 15px var(--f-mono)}
.soilbar{height:12px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.soilbar i{position:absolute;inset:0 auto 0 0;background:var(--water)}
.soilbar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--soon)}
.need{display:grid;gap:7px}
.need .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:13px}
.need .bar{grid-column:1 / -1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.need .bar i{display:block;height:100%}
label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
input[type=number],select{font:14px var(--f-body);color:var(--ink);background:var(--surface-solid);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
input[type=range]{width:100%;accent-color:var(--water)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:4px;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;padding:5px 6px;font-size:12px}
.sect{display:grid;gap:8px} .sect-h{display:flex;justify-content:space-between;align-items:baseline}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:stretch}
.prow .plot{min-width:0} .prow .plot span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{border:1px solid var(--line);background:var(--surface-solid);color:var(--muted);padding:0 11px;font-size:15px}
.del:hover{color:var(--now);border-color:var(--now)}
.confirm{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--now);border-radius:10px;background:var(--surface-solid);font-size:13px}
.confirm div{display:flex;gap:6px} .confirm .yes{background:var(--now);color:#fff}
button.primary{background:var(--accent);color:var(--accent-ink)}
.addform{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-solid)}
.today{display:grid;gap:8px}
.today h2{font:700 17px var(--f-display)}
.todo{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;background:var(--surface-solid);border:1px solid var(--line);text-align:left;font-weight:500}
.todo b{font-family:var(--f-mono)}
.big{font:700 26px var(--f-display);line-height:1.1}
details.tech{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
details.tech summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
details.tech[open] summary{margin-bottom:8px}
#legend{left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 14px;max-width:min(560px,calc(100% - 400px))}
#legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px}
#help{left:50%;transform:translateX(-50%);top:calc(max(12px,env(safe-area-inset-top,0px)) + 56px);padding:6px 12px;font-size:12px;color:var(--muted);white-space:nowrap}
#pad{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 56px);display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px;padding:6px}
#pad button{background:var(--surface-solid);border:1px solid var(--line);font-size:18px;padding:0;touch-action:none;user-select:none}
#pad .up{grid-column:2} #pad .l{grid-column:1;grid-row:2} #pad .dn{grid-column:2;grid-row:2} #pad .r{grid-column:3;grid-row:2}
#sheet{display:none}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
@media (max-width:760px){
  #panel{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:auto;width:auto;max-height:50%}
  #panel.closed .scroll{display:none}
  #sheet{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;background:transparent;border-radius:0;width:100%}
  #legend{display:none} #help{display:none}
  #modes{top:auto;bottom:calc(50% + 28px)}
  #panel.closed ~ #modes{bottom:84px}
  #pad{bottom:calc(50% + 80px)}
}
</style>

<div id="app">
  <canvas id="scene" aria-label="Vue 3D de la ferme : cliquez une parcelle pour voir son besoin en eau"></canvas>
  <div class="float" id="title"><h1>Ma ferme en 3D</h1><p>Chott Meriam, Sousse · météo du <span id="dt"></span> · <span id="nplots"></span></p></div>
  <div class="float" id="help">Glisser pour tourner · molette pour zoomer · cliquer une parcelle</div>
  <div class="float" id="panel">
    <button id="sheet" type="button" aria-expanded="true"><span id="sheet-t">Parcelles</span><span aria-hidden="true">▾</span></button>
    <div class="scroll">
      <div class="today" id="need"></div>
      <div class="sect">
        <div class="sect-h"><span class="lab">Mes parcelles</span><span class="hint" id="count"></span></div>
        <div class="plots" id="plots"></div>
        <button class="add" id="add" type="button">+ Ajouter une parcelle</button>
        <form id="addform" class="addform" hidden autocomplete="off">
          <b>Nouvelle parcelle</b>
          <label>Quelle plante ?<select id="a-crop"></select></label>
          <div class="row2"><label>Surface (hectares)<input type="number" id="a-area" min="0.1" max="4" step="0.1" value="0.5"></label>
          <label>Dernier arrosage<select id="a-last"></select></label></div>
          <label>Type de sol<select id="a-soil"></select></label>
          <label>Arrosage<select id="a-meth"></select></label>
          <div class="row2"><button class="primary" type="submit">Ajouter</button><button class="ghost" type="button" id="a-cancel">Annuler</button></div>
        </form>
      </div>
      <div class="detail" id="detail"></div>
      <div class="sect">
        <span class="lab">Bassin d'eau</span>
        <label for="water">Eau disponible aujourd'hui : <b class="mono" id="wl"></b></label>
        <input type="range" id="water" min="0" max="4000" step="50" value="1500">
        <span class="hint" id="wnote"></span>
      </div>
      <div class="sect" id="engine">
        <span class="lab">Moteur de calcul</span>
        <span style="display:flex;gap:8px;align-items:center;font-size:13px"><i class="dot" id="engine-dot"></i><span id="engine-st"></span></span>
        <div class="row2" style="grid-template-columns:1fr auto"><label for="api-url">Adresse de l'API FARMLINK<input id="api-url" type="url" value="http://localhost:8001" style="font:13px var(--f-mono)"></label><button class="ghost" id="api-go" type="button" style="align-self:end">Connecter</button></div>
        <span class="hint" id="engine-err" hidden></span>
        <span class="hint">Avec l'API lancée (services/api), les décisions viennent du vrai moteur Python et de la météo du jour.</span>
      </div>
      <button class="ghost" id="reset" type="button">Revenir à la ferme d'exemple</button>
    </div>
  </div>
  <div class="float" id="modes" role="group" aria-label="Mode de vue"><button id="m-over" class="on" type="button">Vue d'ensemble</button><button id="m-walk" type="button">Promenade</button></div>
  <div class="float" id="pad" hidden aria-label="Marcher">
    <button class="up" data-k="f" type="button" aria-label="Avancer">▲</button><button class="l" data-k="l" type="button" aria-label="Tourner à gauche">◀</button><button class="dn" data-k="b" type="button" aria-label="Reculer">▼</button><button class="r" data-k="r" type="button" aria-label="Tourner à droite">▶</button>
  </div>
  <div class="float" id="legend"></div>
  <div id="err" hidden></div>
</div>

<script type="application/json" id="farm">__FARM__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const FARM = JSON.parse(document.getElementById('farm').textContent);
const $ = s => document.querySelector(s);
const fmt = (v, d = 0) => v == null || !isFinite(v) ? '—' : Number(v).toLocaleString('fr-FR', {minimumFractionDigits:d, maximumFractionDigits:d});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('#dt').textContent = FARM.date.split('-').reverse().join('/');
if (!window.THREE){ const e = $('#err'); e.hidden = false; e.innerHTML = '<p>La bibliothèque 3D n\'a pas pu se charger. Vérifiez la connexion puis rechargez la page.</p>'; return; }

/* ---------- crops and FAO-56 parameters ---------- */
const CROP = Object.fromEntries(FARM.crops.map(c => [c.id, c]));
const CAT = {vegetable:'Légumes', cereal:'Céréales', legume:'Légumineuses', tree:'Arbres', fruit:'Fruits', forage:'Fourrages', industrial:'Cultures industrielles', oilseed:'Oléagineux'};
const NAME = id => ((CROP[id] || {}).fr || id).replace(/\s*\(.*\)$/, '');
const STAGE_FR = {initial:'début', development:'développement', mid_season:'pleine saison', late_season:'fin de saison'};
const SOILS = {loamy_sand:{fc:.15, wp:.06, fr:'Sable limoneux'}, sandy_loam:{fc:.22, wp:.10, fr:'Limon sableux'}, loam:{fc:.25, wp:.11, fr:'Limon'}, clay_loam:{fc:.30, wp:.15, fr:'Limon argileux'}, silt:{fc:.32, wp:.15, fr:'Limon fin'}, silty_clay:{fc:.35, wp:.23, fr:'Argile limoneuse'}};
const EA = {surface:.60, sprinkler:.75, drip:.90};
const ETO0 = FARM.etoToday, FC = FARM.forecast;
const kcStage = (c, st) => ({initial:c.ini, development:(c.ini+c.mid)/2, mid_season:c.mid, late_season:(c.mid+c.end)/2})[st];
const adjP = (p, etc) => clamp(p + 0.04*(5-etc), .1, .8);
function rootDepth(c, st){ // engine rule: linear from 0.30 m to the scheduling depth over initial+development; perennials constant
  const zr = c.zr[2] || c.zr[0]; if (c.perennial || zr <= .3) return zr;
  const [ini, dev] = [c.sl[0] || 30, c.sl[1] || 40];
  const day = st === 'initial' ? ini/2 : st === 'development' ? ini + dev/2 : ini + dev;
  return .3 + (zr - .3) * Math.min(day/(ini+dev), 1);
}
function params(f){
  const z = f.z;
  if (z && z.crop === f.crop && z.stage === f.stage && z.zr_m) // unchanged demo plot: exact engine values from the notebook run
    return {kc:z.kc, etc:z.etc_mm, zr:z.zr_m, p:z.p, stageEst:!!z.stage_estimated, proj:z.proj && z.proj.length ? z.proj.map(p=>({cum:p.dr_end_mm - z.dr_mm, pf:p.raw_mm/z.taw_mm, rain:p.rain_mm})) : null, src:'moteur'};
  const c = CROP[f.crop], kc = kcStage(c, f.stage), etc = kc*ETO0, p = adjP(c.p, etc);
  let cum = 0; const proj = FC.map(d => { cum += kc*d.eto; return {cum, pf:adjP(c.p, kc*d.eto), rain:d.rain}; });
  return {kc, etc, zr:rootDepth(c, f.stage), p, stageEst:false, proj, src:'calcul'};
}

/* ---------- farm engine (port of engine/prioritization.py, verified against Python) ---------- */
const DEMO_SOIL = {Z1:'clay_loam', Z2:'sandy_loam', Z3:'loam', Z4:''};
const DEMO_METH = {Z1:'sprinkler', Z2:'drip', Z3:'drip', Z4:'drip'};
let FZ, nextId = 5;
function resetFarm(){
  FZ = FARM.zones.map(z => { const s = DEMO_SOIL[z.zone_id]; return {id:z.zone_id, crop:z.crop, stage:z.stage, area:z.area_ha, dr:z.dr_mm ?? 30, soilKey:s, soil:s ? {fc:SOILS[s].fc, wp:SOILS[s].wp} : {fc:'', wp:''}, method:DEMO_METH[z.zone_id], lastDays:null, z}; });
  nextId = 5; $('#water').value = 1500;
}
function evalZone(f){
  const P = params(f), fc = +f.soil.fc, wp = +f.soil.wp;
  const base = {id:f.id, P, daily:P.etc*f.area*10};
  if (!(f.soil.fc !== '' && f.soil.wp !== '' && fc > wp && wp >= 0)) return {...base, status:'NEEDS_DATA'};
  const taw = 1000*(fc-wp)*P.zr, raw = P.p*taw, ea = EA[f.method];
  // demo plots keep the engine's depletion; otherwise depletion = days since the last full irrigation × crop use (no rain)
  const dr = clamp(f.lastDays == null ? +f.dr : f.lastDays*P.etc, 0, taw);
  const proj = P.proj || [1,2,3,4,5].map(i=>({cum:i*P.etc, pf:P.p, rain:0}));
  let days = dr >= raw ? 0 : null, dAt = null;
  if (days === null) proj.forEach((p,i)=>{ const d = clamp(dr+p.cum,0,taw); if (days === null && d >= p.pf*taw){ days = i+1; dAt = d; } });
  const timing = days === 0 ? 'now' : days ? 'soon' : 'none';
  const net = timing==='now' ? dr : timing==='soon' ? dAt : 0, gross = net/ea, m3 = gross*f.area*10;
  const ratio = dr/raw, rainF = proj.reduce((a,p)=>a+p.rain,0), stageS = (f.stage==='development'||f.stage==='mid_season') ? 1 : .5;
  const urg = days==null?0: days<=0?1: days<=1?.75: days<=3?.5: days<=5?.25:0;
  const rr = (net>0 && days!==0) ? Math.min(rainF/net,1) : 0, dq = P.stageEst ? .25 : 0;
  const comp = {stress:Math.min(ratio,1.5)/1.5, urgency:urg, stage:stageS, buffer:1-Math.min(taw/60,1), rain_relief:rr, data_quality:dq};
  const W = {stress:.5, urgency:.2, stage:.15, buffer:.1, rain_relief:-.15, data_quality:-.1};
  const score = Object.keys(W).reduce((a,k)=>a+W[k]*comp[k],0);
  const level = (ratio>=1 || (days!=null && days<=1)) ? 'HIGH' : ((days!=null && days<=3) || ratio>=.7) ? 'MEDIUM' : 'LOW';
  return {...base, status:'OK', taw, raw, dr, ea, days, timing, net, gross, m3, area:f.area, ratio, score, level};
}
function farmCompute(water){
  const ev = FZ.map(evalZone), ok = ev.filter(e=>e.status==='OK'), ord = {HIGH:0,MEDIUM:1,LOW:2};
  ok.sort((a,b)=>ord[a.level]-ord[b.level] || b.score-a.score || a.id.localeCompare(b.id)); ok.forEach((z,i)=>z.rank=i+1);
  let left = water; ok.forEach(p=>p.alloc=0);
  for (const phase of [1,2]) for (const p of ok){ const target = phase===1 ? Math.max(p.dr-p.raw,0) : p.dr; const already = p.alloc/(p.area*10)*p.ea; const need = Math.max(target-already,0); const m3 = need>0 ? need/p.ea*p.area*10 : 0; const give = Math.min(m3,left); p.alloc += give; left -= give; }
  ok.forEach(p=>{ p.netApplied = p.alloc/(p.area*10)*p.ea; p.residual = Math.max(p.dr-p.netApplied,0); p.full = p.alloc >= p.m3 - 1e-9; });
  return {ev, left, need: ok.reduce((a,p)=>a+p.m3,0), nOk: ok.length};
}

/* ---------- status vocabulary ---------- */
const SCOL = {now:'#c8322a', soon:'#d9861c', none:'#2f8a45', NEEDS_DATA:'#6b7f93'};
const SVAR = {now:'--now', soon:'--soon', none:'--fine', NEEDS_DATA:'--missing'};
const key = e => e.status==='OK' ? e.timing : 'NEEDS_DATA';
const title = e => e.status!=='OK' ? 'Sol à renseigner' : e.timing==='now' ? 'Arroser maintenant' : e.timing==='soon' ? `Arroser d'ici ${e.days} j` : 'Pas besoin d\'arroser';
const LVL = {HIGH:'Priorité haute', MEDIUM:'Priorité moyenne', LOW:'Priorité basse'};
$('#legend').innerHTML = [['now','Arroser maintenant'],['soon','Arroser bientôt'],['none','Pas besoin'],['NEEDS_DATA','Sol à renseigner']].map(([k,t])=>`<span><i class="dot" style="background:var(${SVAR[k]})"></i>${t}</span>`).join('');

/* ---------- three.js scene (realistic look: PBR materials, sky, procedural textures, terrain) ---------- */
const canvas = $('#scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .82;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const HORIZON = new THREE.Color('#e4dccb');
scene.fog = new THREE.Fog(HORIZON, 160, 520);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1500);
const SUN_DIR = new THREE.Vector3(-.45, .62, .4).normalize();
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), new THREE.ShaderMaterial({side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{top:{value:new THREE.Color('#4f88c6')}, bottom:{value:HORIZON}, sunDir:{value:SUN_DIR}},
  vertexShader:'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',

function buildPlot(i){

async function apiFetch(path, opts = {}, ms = 4000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(API.url.replace(/\/+$/, '') + path, {...opts, signal: ctl.signal}); if (!r.ok) throw new Error(`HTTP ${r.status}`); return await r.json(); }

async function connectApi(manual = true){

  try { const h = await apiFetch('/api/v1/health', {}, 2500); API.on = !!(h && h.ok); } catch (e) { API.on = false; API.error = manual ? 'API injoignable à cette adresse. Lancez services/api puis réessayez.' : null; }

}
function zonePayload(f){

  const fc = +f.soil.fc, wp = +f.soil.wp;
  if (f.soil.fc !== '' && f.soil.wp !== '' && fc > wp && wp > 0) z.soil = {fc, wp, source: f.soilKey === 'custom' ? 'measured' : 'user_declared'};

}

    const base = {id: f.id, P, daily: (z.etc_mm || 0)*f.area*10};
    if (z.status !== 'OK') return {...base, status: 'NEEDS_DATA', msg: z.message || z.status};
    const m = /irrigate_within_(\d+)_days/.exec(z.timing || ''), timing = z.timing === 'irrigate_now' ? 'now' : m ? 'soon' : 'none';
    const r = rank[f.id] || {}, a = plan[f.id] || {}, vol = z.volumes || {};

$('#add').onclick = () => { if (FZ.length < SLOT.length) openAdd(); };
$('#a-cancel').onclick = closeAdd;
$('#addform').addEventListener('submit', ev => { ev.preventDefault(); if (FZ.length >= SLOT.length) return closeAdd();
  const s = $('#a-soil').value;
  FZ.push({id:'Z'+(nextId++), crop:$('#a-crop').value, stage:'mid_season', area:clamp(+$('#a-area').value || .5, .1, 4), dr:0, lastDays:+$('#a-last').value,
    soilKey:s, soil: SOILS[s] ? {fc:SOILS[s].fc, wp:SOILS[s].wp} : {fc:'', wp:''}, method:$('#a-meth').value, z:null});
  sel = FZ.length-1; closeAdd(); refresh(); flyTo(sel); });
$('#water').addEventListener('input', refresh);
$('#reset').onclick = () => { resetFarm(); sel = 1; delPending = -1; closeAdd(); refresh(); };
$('#sheet').onclick = () => { const p = $('#panel'); p.classList.toggle('closed'); $('#sheet').setAttribute('aria-expanded', !p.classList.contains('closed')); };
function select(i, fly){ sel = i; delPending = -1; renderList(); renderDetail(); if (fly) flyTo(i); }

/* ---------- camera: overview (orbit) and walk ---------- */
let mode = 'over';
const wide = () => innerWidth > 760;
const orbit = {target:new THREE.Vector3(wide()?14:0, 0, wide()?0:8), yaw:.55, pitch:.5, dist:wide()?95:115}, goal = {target:orbit.target.clone(), yaw:orbit.yaw, pitch:orbit.pitch, dist:orbit.dist};
const walker = {pos:new THREE.Vector3(0,1.7,46), yaw:0, pitch:-.05};
function flyTo(i){ const p = plots[i]; if (!p) return; const c = p.center;
  if (mode==='walk'){ walker.pos.set(c.x*.25, 1.7, c.z + (c.z>0 ? 1 : -1)*(p.side/2+5)); walker.yaw = Math.atan2(walker.pos.x-c.x, walker.pos.z-c.z); return; }
  goal.target.set(c.x + (wide()?8:0), 0, c.z); goal.dist = p.side*1.9 + 12; goal.pitch = .7; }
function applyLabelMode(){ plots.forEach(p => { if (mode==='walk'){ p.L.s.scale.set(6.4,2,1); p.L.s.position.y = 4.6; } else { p.L.s.scale.set(16,5,1); p.L.s.position.y = 9; } }); }
function setMode(m){ mode = m; $('#m-over').classList.toggle('on', m==='over'); $('#m-walk').classList.toggle('on', m==='walk'); $('#pad').hidden = m!=='walk';
  $('#help').textContent = m==='walk' ? 'Flèches ou ZQSD/WASD pour marcher · glisser pour regarder · cliquer une parcelle' : 'Glisser pour tourner · molette pour zoomer · cliquer une parcelle';
  applyLabelMode(); if (m==='walk'){ walker.pos.set(0,1.7,46); walker.yaw = 0; walker.pitch = -.08; } }
$('#m-over').onclick = () => setMode('over'); $('#m-walk').onclick = () => setMode('walk');
const KEYS = {KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'sl',KeyD:'sr',ArrowLeft:'l',ArrowRight:'r'}, keys = new Set();
addEventListener('keydown', e => { if (e.target && e.target.closest && e.target.closest('input,select')) return; const k = KEYS[e.code]; if (k){ keys.add(k); if (mode==='walk') e.preventDefault(); } });
addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) keys.delete(k); });
addEventListener('blur', () => keys.clear());
document.querySelectorAll('#pad button').forEach(b => { const k = b.dataset.k; b.addEventListener('pointerdown', e => { e.preventDefault(); keys.add(k); }); ['pointerup','pointerleave','pointercancel'].forEach(t => b.addEventListener(t, () => keys.delete(k))); });
let drag = null; const pts = new Map();
const dist2 = () => { const [a,b] = [...pts.values()]; return Math.hypot(a.x-b.x, a.y-b.y); };
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); drag = {moved:0, pinch: pts.size===2 ? dist2() : null}; canvas.classList.add('dragging'); });
canvas.addEventListener('pointermove', e => { if (!drag) return; const p = pts.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; drag.moved += Math.abs(dx)+Math.abs(dy);
  if (pts.size === 2){ const d = dist2(); if (drag.pinch) goal.dist = clamp(goal.dist * drag.pinch/d, 18, 190); drag.pinch = d; return; }
  if (mode==='over'){ goal.yaw -= dx*.006; goal.pitch = clamp(goal.pitch + dy*.005, .15, 1.45); } else { walker.yaw -= dx*.005; walker.pitch = clamp(walker.pitch - dy*.004, -1, 1); } });
const up = e => { pts.delete(e.pointerId); if (drag && drag.moved < 6 && pts.size===0) pick(e); if (pts.size===0){ drag = null; canvas.classList.remove('dragging'); } };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => { e.preventDefault(); if (mode==='over') goal.dist = clamp(goal.dist * (1 + Math.sign(e.deltaY)*.1), 18, 190); else walker.pos.addScaledVector(new THREE.Vector3(-Math.sin(walker.yaw),0,-Math.cos(walker.yaw)), -Math.sign(e.deltaY)*1.5); }, {passive:false});
const ray = new THREE.Raycaster(), mv = new THREE.Vector2();
function pick(e){ const r = canvas.getBoundingClientRect(); mv.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(mv, camera); const hit = ray.intersectObjects(pickables, false)[0]; if (hit) select(hit.object.userData.idx, false); }

/* ---------- loop ---------- */
function resize(){ const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let lastT = performance.now(), insideSel = -1;
function tick(t){
  const dt = Math.min(.05, (t - lastT)/1000); lastT = t;
  if (mode === 'over'){
    const k = 1 - Math.pow(.002, dt);
    orbit.target.lerp(goal.target, k); orbit.yaw += (goal.yaw-orbit.yaw)*k; orbit.pitch += (goal.pitch-orbit.pitch)*k; orbit.dist += (goal.dist-orbit.dist)*k;
    const cp = Math.cos(orbit.pitch); camera.position.set(orbit.target.x + orbit.dist*cp*Math.sin(orbit.yaw), orbit.dist*Math.sin(orbit.pitch), orbit.target.z + orbit.dist*cp*Math.cos(orbit.yaw)); camera.lookAt(orbit.target);
  } else {
    const sp = 9*dt, fw = new THREE.Vector3(-Math.sin(walker.yaw),0,-Math.cos(walker.yaw)), rt = new THREE.Vector3(-fw.z,0,fw.x);
    if (keys.has('f')) walker.pos.addScaledVector(fw, sp); if (keys.has('b')) walker.pos.addScaledVector(fw, -sp);
    if (keys.has('sl')) walker.pos.addScaledVector(rt, -sp); if (keys.has('sr')) walker.pos.addScaledVector(rt, sp);
    if (keys.has('l')) walker.yaw += 1.8*dt; if (keys.has('r')) walker.yaw -= 1.8*dt;
    walker.pos.x = clamp(walker.pos.x, -90, 90); walker.pos.z = clamp(walker.pos.z, -90, 90);
    camera.position.copy(walker.pos);
    camera.lookAt(walker.pos.x - Math.sin(walker.yaw)*Math.cos(walker.pitch), walker.pos.y + Math.sin(walker.pitch), walker.pos.z - Math.cos(walker.yaw)*Math.cos(walker.pitch));
    const inside = plots.findIndex(p => Math.abs(walker.pos.x-p.center.x) < p.side/2 && Math.abs(walker.pos.z-p.center.z) < p.side/2);
    if (inside !== insideSel){ insideSel = inside; if (inside >= 0 && inside !== sel) select(inside, false); }
  }
  plots.forEach((p, i) => { p.flag.rotation.y = reduce ? 0 : Math.sin(t/700 + i)*.25; });
  renderer.render(scene, camera); requestAnimationFrame(tick);
}
resetFarm(); refresh(); select(1, false); requestAnimationFrame(tick);
$('#api-go').onclick = () => connectApi(true); $('#api-url').addEventListener('keydown', e => { if (e.key === 'Enter') connectApi(); }); connectApi(false);
// self-check: the demo farm must reproduce the notebook engine (1 500 m³ → Z2 1 311, Z1 189)
window.__farmCheck = () => { const r = farmCompute(1500); return r.ev.map(e => [e.id, e.status, e.status==='OK'?+e.score.toFixed(4):null, e.status==='OK'?Math.round(e.m3*10)/10:null, e.status==='OK'?Math.round(e.alloc*10)/10:null]); };
})();
