<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Straw Hat Gradients -->
    <linearGradient id="strawCrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="strawBrim" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    <linearGradient id="hatRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Skin & Blush Gradients -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba868"/>
    </linearGradient>
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>

    <!-- Clothes Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="denimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.25"/>
    </filter>

    <style>
      /* Smooth Keyframe Animations */
      @keyframes waveHand {
        0%, 100% {
          transform: rotate(-18deg);
        }
        50% {
          transform: rotate(24deg);
        }
      }

      @keyframes wristFlex {
        0%, 100% {
          transform: rotate(12deg);
        }
        50% {
          transform: rotate(-14deg);
        }
      }

      @keyframes breatheBody {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      @keyframes blinkEyes {
        0%, 94%, 98%, 100% {
          transform: scaleY(1);
        }
        96% {
          transform: scaleY(0.1);
        }
      }

      .waving-arm-group {
        transform-origin: 326px 212px;
        animation: waveHand 1.4s ease-in-out infinite;
      }

      .wrist-group {
        transform-origin: 388px 125px;
        animation: wristFlex 1.4s ease-in-out infinite;
      }

      .breathing-character {
        transform-origin: 250px 450px;
        animation: breatheBody 2.8s ease-in-out infinite;
      }

      .blinking-eye {
        transform-origin: 250px 195px;
        animation: blinkEyes 4.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="breathing-character">
    <!-- ==================== BODY & TORSO ==================== -->
    <!-- Shoulders / Flannel Shirt -->
    <path d="M 140 480 L 155 330 C 160 300 195 285 240 285 C 285 285 320 300 325 330 L 340 480 Z" 
          fill="url(#shirtGrad)" filter="url(#softShadow)"/>

    <!-- Left Arm & Sleeve (Resting on side) -->
    <path d="M 165 310 C 130 330 115 375 125 430 C 130 450 145 460 160 450 C 170 410 175 365 190 325 Z" 
          fill="url(#shirtGrad)"/>
    <!-- Left Hand / Cuff -->
    <ellipse cx="140" cy="445" rx="16" ry="14" fill="url(#skinGrad)"/>

    <!-- Shirt Collar White Trim -->
    <polygon points="215,285 240,320 220,325" fill="#f8fafc"/>
    <polygon points="265,285 240,320 260,325" fill="#f8fafc"/>

    <!-- Denim Overalls Body -->
    <path d="M 180 480 L 180 340 C 180 335 185 330 190 330 L 290 330 C 295 330 300 335 300 340 L 300 480 Z" 
          fill="url(#denimGrad)"/>
    <path d="M 155 480 L 180 360 L 300 360 L 325 480 Z" fill="url(#denimGrad)"/>

    <!-- Overall Straps -->
    <polygon points="190,340 208,340 198,285 180,285" fill="#0369a1"/>
    <polygon points="272,340 290,340 300,285 282,285" fill="#0369a1"/>

    <!-- Brass Clasps/Buckles -->
    <rect x="187" y="333" width="16" height="14" rx="3" fill="url(#brassGrad)" stroke="#854d0e" stroke-width="1.5"/>
    <circle cx="195" cy="340" r="3" fill="#854d0e"/>
    <rect x="277" y="333" width="16" height="14" rx="3" fill="url(#brassGrad)" stroke="#854d0e" stroke-width="1.5"/>
    <circle cx="285" cy="340" r="3" fill="#854d0e"/>

    <!-- Overalls Center Pocket & Stitched Seams -->
    <path d="M 215 375 L 265 375 C 265 410 255 425 240 425 C 225 425 215 410 215 375 Z" 
          fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <!-- Cute pocket wheat stalk badge -->
    <path d="M 240 385 Q 242 398 240 410 M 236 390 Q 240 392 244 390 M 235 397 Q 240 400 245 397" 
          stroke="#facc15" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- ==================== NECK & HEAD ==================== -->
    <!-- Neck -->
    <rect x="222" y="250" width="36" height="42" rx="4" fill="#fba868"/>
    <!-- Neck shadow from chin -->
    <ellipse cx="240" cy="265" rx="22" ry="8" fill="#ea580c" opacity="0.25"/>

    <!-- Ears -->
    <ellipse cx="182" cy="205" rx="12" ry="16" fill="url(#skinGrad)"/>
    <ellipse cx="182" cy="205" rx="6" ry="9" fill="#fba868"/>
    <ellipse cx="298" cy="205" rx="12" ry="16" fill="url(#skinGrad)"/>
    <ellipse cx="298" cy="205" rx="6" ry="9" fill="#fba868"/>

    <!-- Face Oval -->
    <ellipse cx="240" cy="208" rx="62" ry="68" fill="url(#skinGrad)"/>

    <!-- Rosy Cheeks -->
    <circle cx="198" cy="222" r="15" fill="url(#blushGrad)"/>
    <circle cx="282" cy="222" r="15" fill="url(#blushGrad)"/>

    <!-- Kind Smiling Eyes & Crow's Feet (Blinking Group) -->
    <g class="blinking-eye">
      <!-- Left Eye: gentle warm curved arch -->
      <path d="M 204 195 Q 215 184 226 195" fill="none" stroke="#372b22" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Eye crinkles -->
      <path d="M 201 193 L 195 190 M 200 197 L 194 200" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

      <!-- Right Eye: gentle warm curved arch -->
      <path d="M 254 195 Q 265 184 276 195" fill="none" stroke="#372b22" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Eye crinkles -->
      <path d="M 279 193 L 285 190 M 280 197 L 286 200" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Friendly Bushy Eyebrows (Silver-gray / brown) -->
    <path d="M 202 182 Q 215 174 228 181" fill="none" stroke="#9ca3af" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 252 181 Q 265 174 278 182" fill="none" stroke="#9ca3af" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Warm Friendly Nose -->
    <path d="M 233 210 Q 240 220 247 210" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>

    <!-- Wide Warm Farmer Smile -->
    <!-- Open smiling mouth -->
    <path d="M 218 232 Q 240 262 262 232 Z" fill="#991b1b"/>
    <!-- Top white teeth row -->
    <path d="M 221 232 Q 240 245 259 232 Q 240 236 221 232 Z" fill="#ffffff"/>
    <!-- Cheerful tongue -->
    <path d="M 230 252 Q 240 246 250 252 Q 240 260 230 252 Z" fill="#f87171"/>

    <!-- Characteristic Full Silver/White Mustache (عم الطيب) -->
    <!-- Left Wing -->
    <path d="M 240 226 C 228 224 205 230 198 242 C 205 248 225 245 240 234 Z" 
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
    <!-- Right Wing -->
    <path d="M 240 226 C 252 224 275 230 282 242 C 275 248 255 245 240 234 Z" 
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
    <!-- Center mustache tuft -->
    <circle cx="240" cy="228" r="5" fill="#f8fafc"/>

    <!-- ==================== STRAW AND WIDE-BRIM HAT ==================== -->
    <!-- Under-brim cast shadow on forehead -->
    <ellipse cx="240" cy="168" rx="75" ry="18" fill="#78350f" opacity="0.3"/>

    <!-- Hat Crown (Tall tapered woven dome) -->
    <path d="M 185 160 L 198 85 C 202 70 278 70 282 85 L 295 160 Z" 
          fill="url(#strawCrown)" stroke="#ca8a04" stroke-width="2"/>
    <!-- Straw Weave Horizontal Texture Arcs -->
    <path d="M 200 95 Q 240 105 280 95" fill="none" stroke="#a16207" stroke-width="2" opacity="0.6"/>
    <path d="M 194 115 Q 240 128 286 115" fill="none" stroke="#a16207" stroke-width="2.2" opacity="0.6"/>
    <path d="M 189 138 Q 240 152 291 138" fill="none" stroke="#a16207" stroke-width="2.5" opacity="0.6"/>

    <!-- Hat Ribbon (Green Fabric Band) -->
    <path d="M 186 158 L 189 140 C 220 148 260 148 291 140 L 294 158 C 260 168 220 168 186 158 Z" 
          fill="url(#hatRibbon)"/>
    <!-- Gold Ribbon Clasp -->
    <rect x="233" y="146" width="14" height="15" rx="2" fill="url(#brassGrad)" stroke="#a16207" stroke-width="1.5"/>

    <!-- Wide Straw Brim (Grand, curved, iconic farmer chapeau) -->
    <path d="M 90 165 C 100 135 380 135 390 165 C 390 190 100 190 90 165 Z" 
          fill="url(#strawBrim)" stroke="#a16207" stroke-width="3" filter="url(#softShadow)"/>

    <!-- Straw Brim Weave Details -->
    <path d="M 115 165 C 160 178 320 178 365 165" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="6,4"/>
    <path d="M 130 160 C 180 172 300 172 350 160" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- ==================== WAVING RIGHT ARM & HAND ==================== -->
  <!-- Upper Right Sleeve (Fixed to shoulder, angling up towards elbow) -->
  <path d="M 315 310 C 330 300 355 260 345 220 C 335 210 315 225 305 255 Z" fill="url(#shirtGrad)"/>
  <ellipse cx="330" cy="216" rx="15" ry="13" fill="#b91c1c"/>

  <!-- Rotating Forearm, Wrist & Hand Group (Pivoting at Elbow: 326, 212) -->
  <g class="waving-arm-group">
    <!-- Forearm (Skin tone reaching up-right) -->
    <path d="M 322 216 L 382 130 C 388 122 398 128 394 136 L 334 222 Z" fill="url(#skinGrad)"/>
    <!-- Shirt Cuff at Elbow -->
    <ellipse cx="328" cy="218" rx="14" ry="10" fill="#991b1b"/>

    <!-- Hand & Fingers Group (Tilting at Wrist: 388, 125) -->
    <g class="wrist-group">
      <!-- Palm -->
      <ellipse cx="395" cy="115" rx="18" ry="16" fill="url(#skinGrad)" stroke="#fba868" stroke-width="1"/>

      <!-- Thumb -->
      <path d="M 382 120 C 365 115 362 102 372 98 C 380 95 385 106 388 114 Z" fill="url(#skinGrad)"/>

      <!-- 4 Happy Waving Fingers -->
      <!-- Index -->
      <path d="M 385 102 C 380 82 390 74 397 78 C 404 83 398 96 394 103 Z" fill="url(#skinGrad)"/>
      <!-- Middle -->
      <path d="M 395 100 C 395 76 407 72 413 77 C 418 83 410 97 405 102 Z" fill="url(#skinGrad)"/>
      <!-- Ring -->
      <path d="M 405 103 C 412 80 422 78 427 84 C 431 90 420 102 414 107 Z" fill="url(#skinGrad)"/>
      <!-- Pinky -->
      <path d="M 412 110 C 424 92 434 94 436 101 C 438 108 426 117 418 118 Z" fill="url(#skinGrad)"/>

      <!-- Friendly motion trail lines (subtle sparkle/wave indicators) -->
      <path d="M 445 78 C 452 86 450 96 444 105" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M 456 86 C 462 94 460 102 455 109" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>
</svg>
