[project]
name = "farmlink-api"
version = "0.1.0"
description = "FARMLINK FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "argon2-cffi",
    "asyncpg",
    "cryptography",
    "fastapi",
    "paho-mqtt",
    "pydantic>=2.0,<3.0",
    "pydantic-settings",
    "pyjwt",
    "python-multipart",
    "pywebpush",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]",
]

[project.optional-dependencies]
ml = [
    "numpy",
    "onnxruntime",
    "pillow",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "schemathesis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
